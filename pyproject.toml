[project]
name = "reporag"
version = "0.1.0"
description = "Repository-aware retrieval research toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
