[project]
name = "reporag"
version = "0.1.0"
description = "Repository-aware retrieval research toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "huggingface-hub==0.36.2",
    "numpy==2.5.3",
    "openai==3.26.1",
    "python-dotenv==1.2.4",
    "sentence-transformers==5.7.0",
    "torch==2.14.1",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.21.0",
    "transformers==4.57.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
